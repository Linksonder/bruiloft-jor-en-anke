<!DOCTYPE html>
<html class="no-js">
	<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Admin - Bruiloft Jor & Anke</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<!-- Favicon -->
	<link rel="icon" type="image/png" href="images/website-icon.png">
	
	<!-- Bootstrap  -->
	<link rel="stylesheet" href="css/bootstrap.css">
	<!-- Theme style  -->
	<link rel="stylesheet" href="css/style.css">

	<style>
		body {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: 'Work Sans', Arial, sans-serif;
		}
		.admin-container {
			max-width: 500px;
			width: 100%;
			padding: 20px;
		}
		.admin-card {
			background: white;
			border-radius: 15px;
			padding: 40px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.2);
		}
		.admin-header {
			text-align: center;
			margin-bottom: 30px;
		}
		.admin-header h1 {
			color: #F14E95;
			font-size: 32px;
			margin-bottom: 10px;
		}
		.admin-header p {
			color: #666;
			font-size: 16px;
		}
		.form-group {
			margin-bottom: 20px;
		}
		.form-group label {
			display: block;
			margin-bottom: 8px;
			color: #333;
			font-weight: 600;
		}
		.form-group input {
			width: 100%;
			padding: 12px 15px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 16px;
			transition: border-color 0.3s;
		}
		.form-group input:focus {
			outline: none;
			border-color: #F14E95;
		}
		.btn-admin {
			width: 100%;
			padding: 14px;
			background: #F14E95;
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 18px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.3s;
		}
		.btn-admin:hover {
			background: #d63d7f;
		}
		.btn-admin:disabled {
			background: #ccc;
			cursor: not-allowed;
		}
		.alert {
			padding: 12px 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			font-size: 14px;
		}
		.alert-success {
			background: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
		}
		.alert-error {
			background: #f8d7da;
			color: #721c24;
			border: 1px solid #f5c6cb;
		}
		.back-link {
			text-align: center;
			margin-top: 20px;
		}
		.back-link a {
			color: white;
			text-decoration: none;
			font-size: 16px;
		}
		.back-link a:hover {
			text-decoration: underline;
		}
		.dashboard {
			display: none;
		}
		.dashboard-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 30px;
			padding-bottom: 20px;
			border-bottom: 2px solid #f0f0f0;
		}
		.dashboard-header h2 {
			color: #333;
			margin: 0;
		}
		.btn-logout {
			padding: 8px 20px;
			background: #dc3545;
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
		}
		.btn-logout:hover {
			background: #c82333;
		}
		.dashboard-section {
			margin-bottom: 30px;
		}
		.dashboard-section h3 {
			color: #F14E95;
			font-size: 20px;
			margin-bottom: 15px;
		}
		.leaderboard-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 12px;
			background: #f8f8f8;
			margin-bottom: 8px;
			border-radius: 6px;
		}
		.leaderboard-item:hover {
			background: #f0f0f0;
		}
		.btn-delete {
			padding: 5px 12px;
			background: #dc3545;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 12px;
		}
		.btn-delete:hover {
			background: #c82333;
		}
	</style>

	</head>
	<body>
		
	<div class="admin-container">
		<!-- Login Form -->
		<div id="login-form" class="admin-card">
			<div class="admin-header">
				<h1>🔐 Admin Login</h1>
				<p>Bruiloft Jor & Anke</p>
			</div>
			
			<div id="login-feedback"></div>
			
			<form id="loginForm">
				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" placeholder="jouw@email.nl" required>
				</div>
				<div class="form-group">
					<label for="password">Wachtwoord</label>
					<input type="password" id="password" placeholder="••••••••" required>
				</div>
				<button type="button" class="btn-admin" id="loginBtn">Inloggen</button>
			</form>
			
			<div class="back-link">
				<a href="index.html">← Terug naar website</a>
			</div>
		</div>

		<!-- Admin Dashboard -->
		<div id="admin-dashboard" class="admin-card dashboard">
			<div class="dashboard-header">
				<div>
					<h2>Admin Dashboard</h2>
					<a href="index.html" style="color: #666; text-decoration: none; font-size: 14px;">← Terug naar website</a>
				</div>
				<button class="btn-logout" id="logoutBtn">Uitloggen</button>
			</div>

			<div class="dashboard-section">
				<h3>🏆 Leaderboard Beheer</h3>
				<div id="admin-leaderboard">
					<p style="text-align: center; color: #999;">Laden...</p>
				</div>
			</div>

			<div class="dashboard-section">
				<h3>📊 Statistieken</h3>
				<div id="stats" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
					<div style="padding: 20px; background: #f8f8f8; border-radius: 8px; text-align: center;">
						<div style="font-size: 32px; color: #F14E95; font-weight: bold;" id="total-players">-</div>
						<div style="color: #666; margin-top: 5px;">Spelers</div>
					</div>
					<div style="padding: 20px; background: #f8f8f8; border-radius: 8px; text-align: center;">
						<div style="font-size: 32px; color: #F14E95; font-weight: bold;" id="avg-score">-</div>
						<div style="color: #666; margin-top: 5px;">Gem. Score</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Supabase JS -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
	<script>
		// Supabase Configuration
		var SUPABASE_URL = 'https://rkdlhwkihbdclxrpxmoa.supabase.co';
		var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZGxod2tpaGJkY2x4cnB4bW9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzI4MzMsImV4cCI6MjA4Mjk0ODgzM30.9TeWzRerZ2Mnqkcr1DSJjSJNfjC14xCr05ChYeNE3T8';
		var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

		// Check if already logged in
		async function checkAuth() {
			const { data: { session } } = await supabase.auth.getSession();
			if (session) {
				showDashboard();
			}
		}

		// Login
		document.getElementById('loginBtn').addEventListener('click', async function() {
			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;
			const loginBtn = document.getElementById('loginBtn');
			const feedback = document.getElementById('login-feedback');
			
			// Basic validation
			if (!email || !password) {
				feedback.innerHTML = '<div class="alert alert-error">❌ Vul email en wachtwoord in.</div>';
				return;
			}
			
			loginBtn.disabled = true;
			loginBtn.textContent = 'Bezig met inloggen...';
			feedback.innerHTML = '';
			
			try {
				const { data, error } = await supabase.auth.signInWithPassword({
					email: email,
					password: password
				});
				
				if (error) throw error;
				
				feedback.innerHTML = '<div class="alert alert-success">✅ Ingelogd! Dashboard wordt geladen...</div>';
				setTimeout(() => showDashboard(), 1000);
				
			} catch (error) {
				console.error('Login error:', error);
				feedback.innerHTML = `<div class="alert alert-error">❌ ${error.message}</div>`;
				loginBtn.disabled = false;
				loginBtn.textContent = 'Inloggen';
			}
		});

		// Logout
		document.getElementById('logoutBtn').addEventListener('click', async function() {
			await supabase.auth.signOut();
			location.reload();
		});

		// Show Dashboard
		function showDashboard() {
			document.getElementById('login-form').style.display = 'none';
			document.getElementById('admin-dashboard').style.display = 'block';
			loadAdminData();
		}

		// Load Admin Data
		async function loadAdminData() {
			await loadAdminLeaderboard();
			await loadStats();
		}

		// Load Leaderboard for Admin
		async function loadAdminLeaderboard() {
			const leaderboardDiv = document.getElementById('admin-leaderboard');
			
			try {
				const { data, error } = await supabase
					.from('leaderboard')
					.select('*')
					.order('score', { ascending: false });
				
				if (error) throw error;
				
				if (data && data.length > 0) {
					leaderboardDiv.innerHTML = '';
					data.forEach((entry, index) => {
						leaderboardDiv.innerHTML += `
							<div class="leaderboard-item">
								<span><strong>${index + 1}.</strong> ${entry.name} - <strong style="color: #F14E95;">${entry.score}</strong> punten</span>
								<button class="btn-delete" onclick="deleteScore(${entry.id})">Verwijder</button>
							</div>
						`;
					});
				} else {
					leaderboardDiv.innerHTML = '<p style="text-align: center; color: #999;">Nog geen scores.</p>';
				}
				
			} catch (error) {
				console.error('Error loading leaderboard:', error);
				leaderboardDiv.innerHTML = '<p style="text-align: center; color: #dc3545;">Kon leaderboard niet laden.</p>';
			}
		}

		// Delete Score
		async function deleteScore(id) {
			if (!confirm('Weet je zeker dat je deze score wilt verwijderen?')) return;
			
			try {
				const { error } = await supabase
					.from('leaderboard')
					.delete()
					.eq('id', id);
				
				if (error) throw error;
				
				await loadAdminData();
				
			} catch (error) {
				console.error('Error deleting score:', error);
				alert('Kon score niet verwijderen: ' + error.message);
			}
		}

		// Load Stats
		async function loadStats() {
			try {
				const { data, error } = await supabase
					.from('leaderboard')
					.select('score');
				
				if (error) throw error;
				
				const totalPlayers = data.length;
				const avgScore = data.length > 0 
					? Math.round(data.reduce((sum, item) => sum + item.score, 0) / data.length)
					: 0;
				
				document.getElementById('total-players').textContent = totalPlayers;
				document.getElementById('avg-score').textContent = avgScore;
				
			} catch (error) {
				console.error('Error loading stats:', error);
			}
		}

		// Check auth on page load
		checkAuth();
	</script>

	</body>
</html>
